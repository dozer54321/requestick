name: Release installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run pack:installers
      - name: Push image to GHCR
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! docker image inspect requestick:local >/dev/null 2>&1; then
            echo "No requestick:local image — skipping GHCR push."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE_BASE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          docker tag requestick:local "$IMAGE_BASE:${{ github.ref_name }}"
          docker tag requestick:local "$IMAGE_BASE:latest"
          docker push "$IMAGE_BASE:${{ github.ref_name }}"
          docker push "$IMAGE_BASE:latest"
          echo "Pushed $IMAGE_BASE:${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            artifacts/requestick-linux-setup.sh
            artifacts/requestick-linux.tar.gz
            artifacts/requestick-windows.tar.gz
            artifacts/requestick-windows.zip
            artifacts/requestick-source.tar.gz
            artifacts/requestick-docker.tar.gz
            artifacts/requestick-image.tar.gz
          generate_release_notes: true
